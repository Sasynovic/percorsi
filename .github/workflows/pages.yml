# Pubblica l'app su GitHub Pages a ogni push su main.
# Viene pubblicato solo il contenuto dell'app (index.html, css, js, assets)
# della cartella percorsi_shapers_hub_napoli.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp -r percorsi_shapers_hub_napoli/index.html \
                percorsi_shapers_hub_napoli/css \
                percorsi_shapers_hub_napoli/js \
                percorsi_shapers_hub_napoli/assets \
                _site/

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica i file
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
